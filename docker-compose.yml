services:
  postgres:
    image: postgres:16-alpine
    container_name: jabrig-postgres
    environment:
      POSTGRES_DB: jabrig
      POSTGRES_USER: jabrig
      POSTGRES_PASSWORD: jabrig
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jabrig -d jabrig"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jabrig-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: jabrig-app
    env_file:
      - .env
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: jabrig
      POSTGRES_USER: jabrig
      POSTGRES_PASSWORD: jabrig
      REDIS_URL: redis://redis:6379/0
      JABRIG_API_KEY: ${JABRIG_API_KEY:-test-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
